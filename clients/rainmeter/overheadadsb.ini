[Rainmeter]
Update=#UpdateRate#
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Overhead ADSB
Author= Lea Lewis
Version=1.0
Description=Shows the closest tracked aircraft from a JSON API as "Category - Owner - Squawk meaning", or "Aircraft Free Zone" when data is null

[Variables]
URL=https://overhead.mydomain.dev/api/v1/overhead
UpdateRate=10
NF-Plane=[\xf072]
NF-Helicopter=[\xedfd]
NF-Peace=[\xeed6]
NF-Fly=[\xed43]

[MeasureRaw]
Measure=Plugin
Plugin=WebParser.dll
Url=#URL#
RegExp=(?siU)^(.*)$
UpdateRate=#UpdateRate#
Debug=0

[MeasureDataCheck]
Measure=Plugin
Plugin=WebParser.dll
Url=[MeasureRaw]
StringIndex=1
RegExp=(?siU)"data"\s*:\s*(null|\{)
StringIndex2=1
IfMatch=null
IfMatchAction=[!ShowMeter MeterEmpty][!HideMeter MeterIcon][!HideMeter MeterPlaneInfo][!UpdateMeter MeterEmpty][!UpdateMeter MeterIcon][!UpdateMeter MeterPlaneInfo][!Redraw]
IfNotMatchAction=[!HideMeter MeterEmpty][!ShowMeter MeterIcon][!ShowMeter MeterPlaneInfo][!UpdateMeter MeterEmpty][!UpdateMeter MeterIcon][!UpdateMeter MeterPlaneInfo][!Redraw]

[MeasureCategory]
Measure=Plugin
Plugin=WebParser.dll
Url=[MeasureRaw]
StringIndex=1
RegExp=(?siU)"category"\s*:\s*"([^"]*)"
StringIndex2=1
RegExpSubstitute=1
Substitute="^$":"Unknown"

[MeasureCategoryIcon]
Measure=Plugin
Plugin=WebParser.dll
Url=[MeasureRaw]
StringIndex=1
RegExp=(?siU)"category"\s*:\s*"([^"]*)"
StringIndex2=1
RegExpSubstitute=1
Substitute="^PLANE$":"#NF-Plane#","^HELI$":"#NF-Helicopter#","^$":"#NF-Fly#"

[MeasureOwner]
Measure=Plugin
Plugin=WebParser.dll
Url=[MeasureRaw]
StringIndex=1
RegExp=(?siU)"owner"\s*:\s*"([^"]*)"
StringIndex2=1
RegExpSubstitute=1
Substitute="^$":"Unknown"

[MeasureSquawkMeaning]
Measure=Plugin
Plugin=WebParser.dll
Url=[MeasureRaw]
StringIndex=1
RegExp=(?siU)"squawk_meaning"\s*:\s*(?:"([^"]*)"|null)
StringIndex2=1
RegExpSubstitute=1
Substitute="^$":"Unknown","^null$":"Unknown"

[MeterPlaneInfo]
Meter=String
MeasureName=MeasureCategoryIcon
MeasureName2=MeasureSquawkMeaning
MeasureName3=MeasureOwner
X=512
Y=50
W=1024
H=100
FontFace=Iosevka NF
FontSize=30
FontColor=737994
AntiAlias=1
StringAlign=CenterCenter
ClipString=1
Text=%2 %1  %3

[MeterEmpty]
Meter=String
Hidden=1
X=512
Y=50
W=1024
H=100
FontFace=Iosevka NF
FontSize=30
FontColor=737994
AntiAlias=1
StringAlign=CenterCenter
Text=#NF-Peace# Aircraft Free Zone
