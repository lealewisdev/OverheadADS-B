apiVersion: 1

providers:
  - name: 'overheadadsb'
    orgId: 1
    folder: 'OverheadADS-B'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/overheadadsb
      foldersFromFilesStructure: false
