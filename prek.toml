default_install_hook_types = ["pre-commit", "commit-msg", "pre-push"]

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-added-large-files" },
]

[[repos]]
repo = "local"
hooks = [
    {
      id = "trivy-lockfile",
      name = "trivy: uv.lock vulnerabilities",
      entry = """\
        trivy fs --scanners vuln --skip-dirs .venv --skip-dirs .git \
        --exit-code 1 --ignore-unfixed --severity CRITICAL,HIGH \
        --ignorefile packaging/.trivyignore .\
        """,
      language = "system",
      pass_filenames = false,
      files = "^(uv\\.lock|pyproject\\.toml|packaging/\\.trivyignore)$",
      stages = ["pre-push"]
    },

    {
      id = "docker-test-target",
      name = "docker build --target test",
      entry = "docker buildx build --target test .",
      language = "system",
      pass_filenames = false,
      files = """\
        ^(src/|tests/|packaging/|pyproject\\.toml|uv\\.lock|\
        Dockerfile|\\.dockerignore|\\.python-version)\
        """,
      stages = ["pre-push"]
    },

    {
      id = "trivy-image-scan",
      name = "build + trivy image scan (CI replica)",
      entry = """\
        sh -euc 'sbom="$(mktemp)"
        docker buildx build --pull --platform linux/amd64 \
          --target runtime --load -t local/ci-scan:latest .
        trivy image --format cyclonedx --output "$sbom" local/ci-scan:latest
        trivy sbom --exit-code 1 --ignore-unfixed \
          --severity CRITICAL,HIGH \
          --ignorefile packaging/.trivyignore "$sbom"'\
        """,
      language = "system",
      pass_filenames = false,
      always_run = true,
      stages = ["manual"]
    },
]

[[repos]]
repo =  "https://github.com/astral-sh/uv-pre-commit"
rev =  "0.12.17"
hooks = [
    { id = "uv-lock" },
]

[[repos]]
repo = "https://github.com/hadolint/hadolint"
rev = "v2.15.1"
hooks = [
    { id = "hadolint" },
]

[[repos]]
repo = "https://github.com/trufflesecurity/trufflehog"
rev = "v3.97.1"
hooks = [
    { id = "trufflehog" },
]

[[repos]]
repo = "https://github.com/docker-compose-linter/pre-commit-dclint"
rev = "v3.0.0"
hooks = [
    { id = "dclint", files = "^(docker-)?compose\\.ya?ml$", args = ["-c", ".config/.dclintrc", "--fix"] },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.8"
hooks = [
    { id = "ruff-check", args = ["--fix"] },
    { id = "ruff-format" },
]

[[repos]]
repo = "https://github.com/igorshubovych/markdownlint-cli"
rev = "v0.49.1"
hooks = [
    { id = "markdownlint", args = ["--fix"] },
]

[[repos]]
repo = "https://github.com/commitizen-tools/commitizen"
rev = "v4.18.1" # automatically updated by Commitizen
hooks = [
    { id = "commitizen" },
    { id = "commitizen-branch", stages = ["pre-push"] },
]

[[repos]]
repo = "https://github.com/adrienverge/yamllint"
rev = "v1.38.0"
hooks = [
    { id = "yamllint", files = { glob = [".forgejo/workflows/**", "packaging/**"] } },
]

[[repos]]
repo = "https://github.com/ansible/ansible-lint"
rev = "v25.11.0"
hooks = [
  { id = "ansible-lint", files = "^semaphore/", pass_filenames = true, always_run = false },
]

[[repos]]
repo = "https://github.com/renovatebot/pre-commit-hooks"
rev = "44.52.1"
hooks = [
    { id = "renovate-config-validator", files = "^renovate\\.json$" },
]
