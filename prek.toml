default_install_hook_types = ["pre-commit", "commit-msg", "pre-push"]

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-added-large-files" },
]

[[repos]]
repo = "local"
hooks = [
    { id = "hadolint", name = "hadolint", entry = "hadolint", language = "system", types = ["dockerfile"] },
]

[[repos]]
repo = "https://github.com/trufflesecurity/trufflehog"
rev = "v3.97.1"
hooks = [
    { id = "trufflehog" },
]

[[repos]]
repo = "https://github.com/docker-compose-linter/pre-commit-dclint"
rev = "v3.0.0"
hooks = [
    { id = "dclint", files = "^(docker-)?compose\\.ya?ml$", args = ["--fix"] },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.8"
hooks = [
    { id = "ruff-check", args = ["--fix"] },
    { id = "ruff-format" },
]

[[repos]]
repo = "https://github.com/igorshubovych/markdownlint-cli"
rev = "v0.49.1"
hooks = [
    { id = "markdownlint" },
]

[[repos]]
repo = "https://github.com/commitizen-tools/commitizen"
rev = "v4.18.1" # automatically updated by Commitizen
hooks = [
    { id = "commitizen" },
    { id = "commitizen-branch", stages = ["pre-push"] },
]

[[repos]]
repo = "https://github.com/adrienverge/yamllint"
rev = "v1.38.0"
hooks = [
    { id = "yamllint", files = { glob = [".forgejo/workflows/**", "packaging/**"] } },
]

[[repos]]
repo = "https://github.com/ansible/ansible-lint"
rev = "v25.11.0"
hooks = [
  { id = "ansible-lint", files = "^semaphore/", pass_filenames = true, always_run = false },
]

[[repos]]
repo = "https://github.com/renovatebot/pre-commit-hooks"
rev = "44.52.1"
hooks = [
    { id = "renovate-config-validator", files = "^renovate\\.json$" },
]
