[project]
name = "overheadadsb"
version = "1.19.0"
description = "ADS-B telemetry enrichment API"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "prometheus-client>=0.25.0",
    "prometheus-fastapi-instrumentator>=8.0.2",
    "pydantic>=2.13.4",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "defusedxml>=0.7.1",
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "basedpyright>=1.39.10",
    "pdfplumber>=0.11.10",
    "nodriver>=0.50.3",
    "bandit>=1.9.4",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.uv]
# `uv audit` and `uv export --no-dev` (used by the version-bump guard's
# dev-only-dependency carve-out) are both recent additions - this pins
# a floor so a stale runner uv fails loudly instead of behaving
# differently. `uv audit` landed in the 0.11.x series per uv's own
# changelog; dependency-groups support is much older.
required-version = ">=0.11"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.basedpyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
# stubPath = "typings"
exclude = ["**/node_modules", "**/__pycache__", "**/.*", ".venv", "typings", "scripts"]

[tool.ruff]
exclude = ["typings", ".ansible"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = false
