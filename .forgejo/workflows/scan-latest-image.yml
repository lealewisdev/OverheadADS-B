---
name: Scan Latest Image
"on":
  schedule:
    - cron: "0 4 * * *"
      timezone: Europe/London
  workflow_dispatch:
permissions:
  contents: read
env:
  REGISTRY: ${{ vars.REGISTRY }}
  IMAGE_REF: ${{ vars.REGISTRY }}/${{ github.repository }}:latest
concurrency:
  group: scan-latest-image
  cancel-in-progress: true
jobs:
  scan-images:
    runs-on: docker
    timeout-minutes: 15
    steps:
      - name: Checkout
        # yamllint disable-line rule:line-length
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Log In To Registry
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login "$REGISTRY" \
            -u "$REGISTRY_USER" --password-stdin

      - name: Pull Published Image
        run: docker pull "$IMAGE_REF"

      - name: Get Trivy DB Cache Key Date
        id: trivy-date
        run: echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy DB
        # yamllint disable-line rule:line-length
        uses: https://github.com/actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ steps.trivy-date.outputs.date }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Scan Published Image
        run: |
          trivy image \
            --cache-dir ~/.cache/trivy \
            --scanners vuln \
            --exit-code 1 \
            --ignore-unfixed \
            --severity CRITICAL,HIGH \
            --ignorefile packaging/.trivyignore \
            "$IMAGE_REF"

      - name: Clean Up Local Image
        if: always()
        run: docker rmi "$IMAGE_REF" 2>/dev/null || true

      - name: Log Out Of Registry
        if: always()
        run: docker logout "$REGISTRY"

  prune-trivyignore:
    needs: scan-images
    if: '!cancelled()'
    uses: ./.forgejo/workflows/prune-trivyignore.yml
    secrets: inherit

  notify:
    needs: [scan-images, prune-trivyignore]
    if: '!cancelled()'
    runs-on: docker
    timeout-minutes: 5
    steps:
      - name: Notify n8n
        continue-on-error: true
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          N8N_WEBHOOK_TOKEN: ${{ secrets.N8N_WEBHOOK_TOKEN }}
          APPRISE_URL: ${{ secrets.APPRISE_URL }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          SCAN_RESULT: ${{ needs.scan-images.result }}
          PRUNE_RESULT: ${{ needs.prune-trivyignore.result }}
          RUN_URL: >-
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }}
        run: |
          set -eo pipefail
          PAYLOAD=$(jq -n \
            --arg repository "$REPOSITORY" \
            --arg workflow "$WORKFLOW" \
            --arg status "$SCAN_RESULT" \
            --arg trivyignore_status "$PRUNE_RESULT" \
            --arg run_url "$RUN_URL" \
            --arg apprise_url "$APPRISE_URL" \
            '{repository: $repository, workflow: $workflow,
              status: $status, trivyignore_status: $trivyignore_status,
              run_url: $run_url, apprise_url: $apprise_url}')
          curl \
            --fail-with-body \
            --show-error \
            --silent \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Token: ${N8N_WEBHOOK_TOKEN}" \
            -d "$PAYLOAD" \
            "$N8N_WEBHOOK_URL"
