---
name: PR Checks
"on":
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: ${{ vars.REGISTRY }}
  IMAGE: ${{ vars.REGISTRY }}/${{ github.repository }}

jobs:
  hadolint:
    runs-on: docker
    timeout-minutes: 10
    steps:
      - name: Checkout
        # v7.0.1
        # yamllint disable-line rule:line-length
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Lint Dockerfiles
        run: |
          STATUS=0
          while IFS= read -r -d '' file; do
            echo "::group::$file"
            hadolint "$file" || STATUS=1
            echo "::endgroup::"
          done < <(
            find . -type f \
              \( -name 'Dockerfile' \
              -o -name 'Dockerfile.*' \
              -o -name '*.Dockerfile' \) \
              -print0
          )
          exit $STATUS

  dclint:
    runs-on: docker
    timeout-minutes: 5
    steps:
      - name: Checkout
        # v7.0.1
        # yamllint disable-line rule:line-length
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Lint Compose Files
        # yamllint disable-line rule:line-length
        uses: https://github.com/docker-compose-linter/dclint-github-action@18659f6a7956706cb67cf9c1ad5e55f4352cbc17
        with:
          path: ./
          recursive: true

  trufflehog:
    runs-on: docker
    timeout-minutes: 10
    steps:
      - name: Checkout
        # v7.0.1
        # yamllint disable-line rule:line-length
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Scan For Secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          trufflehog git file://. \
            --since-commit "$BASE_SHA" \
            --only-verified \
            --fail

  renovate-config:
    runs-on: docker
    # yamllint disable-line rule:line-length
    container: renovate/renovate:44.52@sha256:778ff1b404d79ef7763f0c904ebb279a4138ffc1017181ad076b1648e37f6dbd
    timeout-minutes: 5
    steps:
      - name: Checkout
        # v7.0.1
        # yamllint disable-line rule:line-length
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate Renovate config
        run: renovate-config-validator --strict

  test:
    runs-on: docker
    timeout-minutes: 15
    steps:
      - name: Checkout
        # v7.0.1
        # yamllint disable-line rule:line-length
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Log In To Registry
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login "$REGISTRY" \
            -u "$REGISTRY_USER" --password-stdin

      - name: Log In To dhi.io
        env:
          DHI_USER: ${{ secrets.DHI_USER }}
          DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
        run: |
          printf '%s' "$DHI_TOKEN" | docker login dhi.io \
            -u "$DHI_USER" --password-stdin

      - name: Build Image
        run: |
          docker buildx inspect forgejo-builder >/dev/null 2>&1 || \
            docker buildx create --name forgejo-builder --use
          docker buildx build \
            --pull \
            --platform linux/amd64 \
            --target runtime \
            --cache-from "type=registry,ref=${IMAGE}:buildcache" \
            -t pr-scan:local \
            --load \
            .

      - name: Lint, Type Check & Test
        run: |
          docker buildx inspect forgejo-builder >/dev/null 2>&1 || \
            docker buildx create --name forgejo-builder --use
          docker buildx build --target test .

      - name: Log Out Of dhi.io
        if: always()
        run: docker logout dhi.io

      - name: Log Out Of Registry
        if: always()
        run: docker logout "$REGISTRY"

      - name: Get Trivy DB Cache Key Date
        id: trivy-date
        run: echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy DB
        # v6.1.0
        # yamllint disable-line rule:line-length
        uses: https://github.com/actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ steps.trivy-date.outputs.date }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Scan Image
        run: |
          trivy image \
            --cache-dir ~/.cache/trivy \
            --scanners vuln \
            --exit-code 1 \
            --ignore-unfixed \
            --severity CRITICAL,HIGH \
            --ignorefile packaging/.trivyignore \
            pr-scan:local
